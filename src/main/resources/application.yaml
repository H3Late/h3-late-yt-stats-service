spring:
  application:
    name: yt-stats-service
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 7d
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  output:
    ansi:
      enabled: ALWAYS
  kafka:
    bootstrap-servers: ${KAFKA_HOST}
    consumer:
      group-id: ${KAFKA_GROUP_ID}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.h3late.stats.dto"
        spring.json.value.default.type: "com.h3late.stats.dto.VideoEventDto"
        spring.json.use.type.headers: false
        security.protocol: SASL_SSL
        sasl.mechanism: PLAIN
        sasl.jaas.config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";'
kafka:
  topic: ${KAFKA_TOPIC}
server:
  port: 8081
  # Railway terminates TLS at its edge and forwards plain HTTP internally; without this, Spring
  # Security can build the wrong (http:// or internal-hostname) OAuth2 redirect_uri.
  forward-headers-strategy: framework
youtube:
  api-key: ${YOUTUBE_API_KEY}
game:
  server:
    url: ${GAME_SERVER_URL:http://localhost:3001}
  token:
    # Shared identically with game-server via Railway env vars — HS256 needs a secret of at
    # least 32 bytes. Left blank by default so local dev without this feature still boots;
    # GameTokenService fails clearly (at issue-time, not startup) if unset.
    secret: ${GAME_TOKEN_SECRET:}
    ttl-seconds: ${GAME_TOKEN_TTL_SECONDS:300}
admin:
  key: ${ADMIN_KEY:}
session:
  cookie:
    domain: ${SESSION_COOKIE_DOMAIN:}
    secure: ${SESSION_COOKIE_SECURE:true}
    same-site: ${SESSION_COOKIE_SAME_SITE:None}
frontend:
  post-login-url: ${FRONTEND_POST_LOGIN_URL:https://h3late.com}
contest:
  # Spring cron (6 fields: second minute hour day-of-month month day-of-week)
  # Default: every Sunday at midnight UTC. Override via CONTEST_ROTATION_CRON env var.
  rotation-cron: ${CONTEST_ROTATION_CRON:0 0 0 * * SUN}
  type: ${CONTEST_TYPE:WEEKLY}
  daily-vote-budget: ${CONTEST_DAILY_VOTE_BUDGET:5}
  min-clip-duration-seconds: ${CONTEST_MIN_CLIP_DURATION_SECONDS:5}
  max-clip-duration-seconds: ${CONTEST_MAX_CLIP_DURATION_SECONDS:180}
  max-submissions-per-user: ${CONTEST_MAX_SUBMISSIONS_PER_USER:3}
  vote-refresh-schedule: ${CONTEST_VOTE_REFRESH_SCHEDULE:DAILY}
logging:
  level:
    root: INFO
    # Silence the massive config dump
    org.apache.kafka.clients.producer.ProducerConfig: WARN
    org.apache.kafka.common.config.AbstractConfig: WARN
    # Silence general metadata and heartbeat noise
    org.apache.kafka: WARN
    # Make application logs stand out
    com.h3late.stats: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"




